name: Build and Push to Docker Hub - Services

on:
  workflow_run:
    workflows: ["Capa de Integración y Testing (CI)"]
    types:
      - completed
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Validar Secretos de Docker Hub
        run: |
          : "${{ secrets.DOCKERHUB_USERNAME }}" || { echo "❌ ERROR: DOCKERHUB_USERNAME no configurado en los secretos de GitHub"; exit 1; }
          : "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "❌ ERROR: DOCKERHUB_TOKEN no configurado en los secretos de GitHub"; exit 1; }
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================================================
      # 2. CAPA LÓGICA: Microservicios Backend Políglotas
      # =========================================================
      - name: Build y Push -> Microservicios Backend
        run: |
          echo "=== ⚙️ Escaneando y Compilando Microservicios de la Capa Lógica ==="
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          
          for service_dir in backend/*/; do
            service_name=$(basename "$service_dir")
            
            if [ "$service_name" != "api-gateway" ] && [ -f "${service_dir}Dockerfile" ]; then
              REPO="${USER}/quetxal-${service_name}"
              echo "🛠️ Procesando Componente con Buildx: ${service_name}"
              
              docker buildx build --push -f ${service_dir}Dockerfile \
                -t ${REPO}:latest \
                -t ${REPO}:${{ github.sha }} \
                ./${service_dir}
            fi
          done

      # =========================================================
      # 2b. TAREAS PROGRAMADAS: CronJobs con imagen propia (fuera de backend/)
      # =========================================================
      - name: Build y Push -> CronJob estreno-notify
        if: hashFiles('k8s/cronjobs/estreno-notify/Dockerfile') != ''
        run: |
          echo "=== ⏰ Compilando imagen del CronJob estreno-notify ==="
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO="${USER}/quetxal-estreno-notify"
          docker buildx build --push -f k8s/cronjobs/estreno-notify/Dockerfile \
            -t ${REPO}:latest \
            -t ${REPO}:${{ github.sha }} \
            ./k8s/cronjobs/estreno-notify

      - name: Dictamen Final del Auditor Técnico
        run: |
          echo "✅ ¡Pipeline de Construcción de Servicios Finalizado Exitosamente!"
