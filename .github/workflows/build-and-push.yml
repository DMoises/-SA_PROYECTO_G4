name: Build and Push to GCR

on:
  push:
    branches:
      - develop
      - main
      - feature/despliegue
    paths:
      - 'backend/**'
      - 'database/**'
      - 'cache/**'
      - 'docker-compose.gateway.yml'
      - 'docker-compose.services.yml'
      - 'docker-compose.db.yml'
      - '.github/workflows/build-and-push.yml'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_REGISTRY: gcr.io
  IMAGE_PREFIX: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@v4

      - name: Set up Cloud SDK de Google
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configurar Autenticación de Docker a GCR
        run: |
          gcloud auth configure-docker gcr.io --quiet

      # ---------------------------------------------------------
      # 1. CAPA PERIMETRAL: API Gateway
      # ---------------------------------------------------------
      - name: Build y Push -> API Gateway
        id: build-gateway
        if: hashFiles('backend/api-gateway/Dockerfile') != ''
        run: |
          echo "=== 🛡️ Compilando API Gateway ==="
          docker build -f backend/api-gateway/Dockerfile \
            -t ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest \
            -t ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }} \
            ./backend/api-gateway
          
          echo "=== 🚀 Subiendo API Gateway a GCR ==="
          docker push ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest
          docker push ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}

      # ---------------------------------------------------------
      # 2. CAPA LÓGICA: Microservicios (Excepción: api-gateway)
      # ---------------------------------------------------------
      - name: Build y Push -> Microservicios Backend
        run: |
          echo "=== ⚙️ Escaneando y Compilando Microservicios ==="
          for service_dir in backend/*/; do
            service_name=$(basename "$service_dir")
            
            # EXCEPCIÓN EXPLÍCITA: Ignorar api-gateway porque ya se compiló arriba
            if [ "$service_name" != "api-gateway" ] && [ -f "${service_dir}Dockerfile" ]; then
              echo "Construyendo: ${service_name}..."
              docker build -f ${service_dir}Dockerfile \
                -t ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service_name}:latest \
                -t ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service_name}:${{ github.sha }} \
                ./${service_dir}
                
              echo "Subiendo: ${service_name}..."
              docker push ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service_name}:latest
              docker push ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service_name}:${{ github.sha }}
            fi
          done

      # ---------------------------------------------------------
      # 3. CAPA DE PERSISTENCIA: Bases de Datos Políglotas
      # ---------------------------------------------------------
      - name: Build y Push -> Bases de Datos
        run: |
          echo "=== 💾 Compilando Capa de Persistencia Aislada ==="
          DATABASES=("auth" "subscription" "catalog" "rating" "fx" "history" "notification")
          
          for db in "${DATABASES[@]}"; do
            if [ -f "database/${db}/Dockerfile" ]; then
              echo "Construyendo Base de Datos: ${db}..."
              docker build -f database/${db}/Dockerfile \
                -t ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${db}-db:latest \
                -t ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${db}-db:${{ github.sha }} \
                ./database/${db}
                
              echo "Subiendo Base de Datos: ${db}..."
              docker push ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${db}-db:latest
              docker push ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${db}-db:${{ github.sha }}
            else
              echo "⚠️ Omitiendo ${db}: No se encontró Dockerfile en database/${db}"
            fi
          done

      # ---------------------------------------------------------
      # 4. CAPA DE OPTIMIZACIÓN: Redis Cache
      # ---------------------------------------------------------
      - name: Build y Push -> Redis Cache
        id: build-redis
        if: hashFiles('cache/Dockerfile') != ''
        run: |
          echo "=== ⚡ Compilando Caché en Memoria ==="
          docker build -f cache/Dockerfile \
            -t ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/redis-cache:latest \
            -t ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/redis-cache:${{ github.sha }} \
            ./cache
            
          echo "=== 🚀 Subiendo Caché a GCR ==="
          docker push ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/redis-cache:latest
          docker push ${{ env.GCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/redis-cache:${{ github.sha }}

      - name: Dictamen Final
        run: |
          echo "✅ ¡Pipeline de Construcción y Almacenamiento Finalizado Exitosamente!"