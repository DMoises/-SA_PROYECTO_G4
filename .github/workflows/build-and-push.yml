name: Build and Push to Docker Hub

on:
  push:
    branches:
      - develop
      - main
      - feature/despliegue
    paths:
      - 'backend/**'
      - 'database/**'
      - 'cache/**'
      - 'docker-compose.gateway.yml'
      - 'docker-compose.services.yml'
      - 'docker-compose.db.yml'
      - '.github/workflows/build-and-push.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@v4

      - name: Validar Secretos de Docker Hub
        run: |
          : "${{ secrets.DOCKERHUB_USERNAME }}" || { echo "❌ ERROR: DOCKERHUB_USERNAME no configurado en los secretos de GitHub"; exit 1; }
          : "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "❌ ERROR: DOCKERHUB_TOKEN no configurado en los secretos de GitHub"; exit 1; }
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================================================
      # 1. CAPA PERIMETRAL: API Gateway
      # =========================================================
      - name: Build y Push -> API Gateway
        if: hashFiles('backend/api-gateway/Dockerfile') != ''
        run: |
          echo "=== 🛡️ Compilando y Subiendo API Gateway a Docker Hub ==="
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/quetxal-api-gateway"
          
          # TÁCTICA: Transacción atómica utilizando buildx y la bandera --push
          docker buildx build --push -f backend/api-gateway/Dockerfile \
            -t ${REPO}:latest \
            -t ${REPO}:${{ github.sha }} \
            ./backend/api-gateway

      # =========================================================
      # 2. CAPA LÓGICA: Microservicios Backend Políglotas
      # =========================================================
      - name: Build y Push -> Microservicios Backend
        run: |
          echo "=== ⚙️ Escaneando y Compilando Microservicios de la Capa Lógica ==="
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          
          for service_dir in backend/*/; do
            service_name=$(basename "$service_dir")
            
            if [ "$service_name" != "api-gateway" ] && [ -f "${service_dir}Dockerfile" ]; then
              REPO="${USER}/quetxal-${service_name}"
              echo "🛠️ Procesando Componente con Buildx: ${service_name}"
              
              # Corregido: Se unifica build y push en un solo paso por componente
              docker buildx build --push -f ${service_dir}Dockerfile \
                -t ${REPO}:latest \
                -t ${REPO}:${{ github.sha }} \
                ./${service_dir}
            fi
          done

      # =========================================================
      # 3. CAPA DE PERSISTENCIA: Bases de Datos Políglotas
      # =========================================================
      - name: Build y Push -> Bases de Datos
        run: |
          echo "=== 💾 Compilando Engine de Persistencia ==="
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          DATABASES=("auth" "subscription" "catalog" "rating" "fx" "history" "notification")
          
          for db in "${DATABASES[@]}"; do
            if [ -f "database/${db}/Dockerfile" ]; then
              REPO="${USER}/quetxal-${db}-db"
              echo "🛠️ Procesando DB con Buildx: ${db}"
              
              # Corregido: Se añade buildx build --push al ciclo de bases de datos
              docker buildx build --push -f database/${db}/Dockerfile \
                -t ${REPO}:latest \
                -t ${REPO}:${{ github.sha }} \
                ./database/${db}
            else
              echo "⚠️ Omitiendo ${db}: Dockerfile no encontrado"
            fi
          done

      # =========================================================
      # 4. CAPA DE OPTIMIZACIÓN: Redis Cache
      # =========================================================
      - name: Build y Push -> Redis Cache
        if: hashFiles('cache/Dockerfile') != ''
        run: |
          echo "=== ⚡ Compilando y Subiendo Capa de Optimización ==="
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/quetxal-redis-cache"
          
          # Corregido: Se unifica con buildx build --push
          docker buildx build --push -f cache/Dockerfile \
            -t ${REPO}:latest \
            -t ${REPO}:${{ github.sha }} \
            ./cache

      - name: Dictamen Final del Auditor Técnico
        run: |
          echo "✅ ¡Pipeline de Construcción y Almacenamiento en Docker Hub Finalizado Exitosamente!"