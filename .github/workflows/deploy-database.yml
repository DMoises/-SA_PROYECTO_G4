name: Deploy Database

on:
  push:
    branches:
      - develop
      - main
      - feature/despliegue
    paths:
      - 'database/**'
      - 'cache/**'
      - 'docker-compose.database.yml'
      - '.env.cloud'
      - '.github/workflows/deploy-database.yml'

  workflow_dispatch:

jobs:
  deploy-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DATABASE_VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify required secrets
        run: |
          : "${{ secrets.SSH_KEY }}" || { echo "SSH_KEY missing"; exit 1; }
          : "${{ secrets.SSH_USER }}" || { echo "SSH_USER missing"; exit 1; }
          : "${{ secrets.DATABASE_VM_IP }}" || { echo "DATABASE_VM_IP missing"; exit 1; }
          : "${{ secrets.DOCKERHUB_USERNAME }}" || { echo "DOCKERHUB_USERNAME missing"; exit 1; }
          : "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "DOCKERHUB_TOKEN missing"; exit 1; }
        shell: bash

      - name: Ensure remote workdir and copy compose
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} "mkdir -p /home/${{ secrets.SSH_USER }}/quetxal"
          scp -i ~/.ssh/id_ed25519 docker-compose.database.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}:/home/${{ secrets.SSH_USER }}/quetxal/docker-compose.database.yml

      - name: Create environment file with secrets
        run: |
          cat > /tmp/.env.database << 'EOF'
          # === Authentication Database ===
          AUTH_DB_NAME=quetxal_auth
          AUTH_DB_USER=auth_user
          AUTH_DB_PASSWORD=${{ secrets.AUTH_DB_PASSWORD }}

          # === Subscription Database ===
          SUBSCRIPTION_DB_NAME=quetxal_subscription
          SUBSCRIPTION_DB_USER=subscription_user
          SUBSCRIPTION_DB_PASSWORD=${{ secrets.SUBSCRIPTION_DB_PASSWORD }}

          # === Catalog Database ===
          CATALOG_DB_NAME=quetxal_catalog
          CATALOG_DB_USER=catalog_user
          CATALOG_DB_PASSWORD=${{ secrets.CATALOG_DB_PASSWORD }}

          # === Rating Database ===
          RATING_DB_NAME=quetxal_rating
          RATING_DB_USER=rating_user
          RATING_DB_PASSWORD=${{ secrets.RATING_DB_PASSWORD }}

          # === FX Database ===
          FX_DB_NAME=quetxal_fx
          FX_DB_USER=fx_user
          FX_DB_PASSWORD=${{ secrets.FX_DB_PASSWORD }}

          # === History Database ===
          HISTORY_DB_NAME=quetxal_history
          HISTORY_DB_USER=history_user
          HISTORY_DB_PASSWORD=${{ secrets.HISTORY_DB_PASSWORD }}

          # === Notification Database ===
          NOTIFICATION_DB_NAME=quetxal_notification
          NOTIFICATION_DB_USER=notification_user
          NOTIFICATION_DB_PASSWORD=${{ secrets.NOTIFICATION_DB_PASSWORD }}

          # === Redis Cache ===
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          EOF

      - name: Copy environment file to Database VM
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/.env.database \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}:/home/${{ secrets.SSH_USER }}/quetxal/.env.cloud

      - name: Deploy or update databases on VM
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} \
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME} \
            DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN} \
            SSH_USER=${SSH_USER} bash -s << 'EOF'
          set -euo pipefail

          WORKDIR="/home/${SSH_USER}/quetxal"
          COMPOSE_FILE="${WORKDIR}/docker-compose.database.yml"

          echo "=== Entrando a ${WORKDIR} ==="
          cd "${WORKDIR}" || { echo "❌ Directorio no encontrado: ${WORKDIR}"; exit 2; }

          echo "=== Validando docker compose file ==="
          docker compose -f "${COMPOSE_FILE}" config || { echo "❌ docker compose config falló"; exit 3; }

          echo "=== Autenticando en Docker Hub desde la VM ==="
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

          echo "=== Pull de imágenes de bases de datos desde Docker Hub (si existen) ==="
          docker compose -f "${COMPOSE_FILE}" pull || true

          echo "=== Parando contenedores antiguos (si existen) ==="
          docker compose -f "${COMPOSE_FILE}" down --remove-orphans || true

          echo "=== Construyendo imágenes locales (si el compose las define) ==="
          docker compose -f "${COMPOSE_FILE}" build --no-cache 2>/dev/null || true

          echo "=== Levantando contenedores de bases de datos ==="
          docker compose -f "${COMPOSE_FILE}" up -d

          echo "=== Esperando inicialización (30s) ==="
          sleep 30

          echo "=== Estado de contenedores ==="
          docker compose -f "${COMPOSE_FILE}" ps

          echo "=== Últimos logs (limitados) ==="
          docker compose -f "${COMPOSE_FILE}" logs --tail=50

          EOF

      - name: Health check - Validate database connectivity
        continue-on-error: true
        run: |
          echo "Running health checks on databases..."
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} << 'EOF'
          set -euo pipefail
          WORKDIR="/home/${{ secrets.SSH_USER }}/quetxal"
          COMPOSE_FILE="${WORKDIR}/docker-compose.database.yml"
          cd "${WORKDIR}" || { echo "❌ Directorio no encontrado: ${WORKDIR}"; exit 2; }

          echo "=== Checking PostgreSQL databases ==="
          # Use the service container names defined in the compose file
          for db in auth subscription catalog rating fx history notification; do
            CONTAINER="quetxal-${db}-db"
            echo "-> Checking ${CONTAINER}..."
            if docker compose -f "${COMPOSE_FILE}" exec -T ${CONTAINER} pg_isready -U ${db}_user 2>/dev/null; then
              echo "✓ ${db} database is ready"
            else
              echo "✗ ${db} database is NOT ready"
            fi
          done

          echo "=== Checking Redis ==="
          if docker compose -f "${COMPOSE_FILE}" exec -T quetxal-redis redis-cli -a ${REDIS_PASSWORD} ping 2>/dev/null | grep PONG; then
            echo "✓ Redis is ready"
          else
            echo "✗ Redis is NOT ready"
          fi
          EOF

      - name: Create backup after deployment
        continue-on-error: true
        run: |
          echo "Creating initial database backup..."
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} << 'EOF'
          set -euo pipefail
          if [ -f /home/${{ secrets.SSH_USER }}/quetxal/scripts/backup-databases.sh ]; then
            echo "Running backup script..."
            bash /home/${{ secrets.SSH_USER }}/quetxal/scripts/backup-databases.sh
            echo "Backup completed"
          else
            echo "No backup script found; skipping."
          fi
          EOF

      - name: Notify deployment
        if: always()
        run: |
          echo "✅ Database deployment completed"
          echo "Database VM: ${{ secrets.DATABASE_VM_IP }}"
          echo "Check status: ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} and run 'docker compose -f /home/${{ secrets.SSH_USER }}/quetxal/docker-compose.database.yml ps'"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Database deployment failed"
          echo "SSH to Database VM: ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}"
          echo "Check logs: docker compose -f /home/${{ secrets.SSH_USER }}/quetxal/docker-compose.database.yml logs"
          exit 1
