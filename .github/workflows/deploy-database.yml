name: Deploy Database

on:
  push:
    branches:
      - develop
      - main
      - feature/despliegue
    paths:
      - 'database/**'
      - 'cache/**'
      - 'docker-compose.database.yml'
      - '.env.cloud'
      - '.github/workflows/deploy-database.yml'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  deploy-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DATABASE_VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy docker-compose file to Database VM
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.database.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}:/home/${{ secrets.SSH_USER }}/quetxal/

      - name: Create environment file with secrets
        run: |
          cat > /tmp/.env.database << 'EOF'
          # === Authentication Database ===
          AUTH_DB_NAME=quetxal_auth
          AUTH_DB_USER=auth_user
          AUTH_DB_PASSWORD=${{ secrets.AUTH_DB_PASSWORD }}

          # === Subscription Database ===
          SUBSCRIPTION_DB_NAME=quetxal_subscription
          SUBSCRIPTION_DB_USER=subscription_user
          SUBSCRIPTION_DB_PASSWORD=${{ secrets.SUBSCRIPTION_DB_PASSWORD }}

          # === Catalog Database ===
          CATALOG_DB_NAME=quetxal_catalog
          CATALOG_DB_USER=catalog_user
          CATALOG_DB_PASSWORD=${{ secrets.CATALOG_DB_PASSWORD }}

          # === Rating Database ===
          RATING_DB_NAME=quetxal_rating
          RATING_DB_USER=rating_user
          RATING_DB_PASSWORD=${{ secrets.RATING_DB_PASSWORD }}

          # === FX Database ===
          FX_DB_NAME=quetxal_fx
          FX_DB_USER=fx_user
          FX_DB_PASSWORD=${{ secrets.FX_DB_PASSWORD }}

          # === History Database ===
          HISTORY_DB_NAME=quetxal_history
          HISTORY_DB_USER=history_user
          HISTORY_DB_PASSWORD=${{ secrets.HISTORY_DB_PASSWORD }}

          # === Notification Database ===
          NOTIFICATION_DB_NAME=quetxal_notification
          NOTIFICATION_DB_USER=notification_user
          NOTIFICATION_DB_PASSWORD=${{ secrets.NOTIFICATION_DB_PASSWORD }}

          # === Redis Cache ===
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          EOF

      - name: Copy environment file to Database VM
        run: |
          scp -i ~/.ssh/id_rsa /tmp/.env.database \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}:/home/${{ secrets.SSH_USER }}/quetxal/.env.cloud

      - name: Deploy or update databases
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} << 'EOF'
          set -e
          cd /home/${{ secrets.SSH_USER }}/quetxal

          echo "=== Checking if databases are running ==="
          RUNNING=$(docker ps -q | wc -l)

          if [ $RUNNING -eq 0 ]; then
            echo "=== First time setup: Starting all databases ==="
          else
            echo "=== Databases already running: Updating configuration ==="
            echo "=== Stopping old containers ==="
            docker-compose -f docker-compose.database.yml down || true
          fi

          echo "=== Building database images (if needed) ==="
          docker-compose -f docker-compose.database.yml build --no-cache 2>/dev/null || true

          echo "=== Starting all database containers ==="
          docker-compose -f docker-compose.database.yml up -d

          echo "=== Waiting for databases to initialize (30 seconds) ==="
          sleep 30

          echo "=== Checking database container status ==="
          docker-compose -f docker-compose.database.yml ps

          echo "=== Database logs (last 50 lines) ==="
          docker-compose -f docker-compose.database.yml logs --tail=50
          EOF

      - name: Health check - Validate database connectivity
        continue-on-error: true
        run: |
          echo "Running health checks on databases..."
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} << 'EOF'

          echo "=== Checking PostgreSQL databases ==="
          for db in auth subscription catalog rating fx history notification; do
            CONTAINER="quetxal-${db}-db"
            if docker exec ${CONTAINER} pg_isready -U ${db}_user 2>/dev/null; then
              echo "✓ ${db} database is ready"
            else
              echo "✗ ${db} database is NOT ready"
            fi
          done

          echo "=== Checking Redis ==="
          if docker exec quetxal-redis redis-cli -a ${{ secrets.REDIS_PASSWORD }} ping 2>/dev/null | grep PONG; then
            echo "✓ Redis is ready"
          else
            echo "✗ Redis is NOT ready"
          fi
          EOF

      - name: Create backup after deployment
        continue-on-error: true
        run: |
          echo "Creating initial database backup..."
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} << 'EOF'
          if [ -f /home/${{ secrets.SSH_USER }}/quetxal/scripts/backup-databases.sh ]; then
            echo "Running backup script..."
            bash /home/${{ secrets.SSH_USER }}/quetxal/scripts/backup-databases.sh
            echo "Backup completed"
          fi
          EOF

      - name: Notify deployment
        if: always()
        run: |
          echo "✅ Database deployment completed"
          echo "Database VM: ${{ secrets.DATABASE_VM_IP }}"
          echo "Check status: ssh to Database VM and run 'docker-compose ps'"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Database deployment failed"
          echo "SSH to Database VM: ssh ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}"
          echo "Check logs: docker-compose logs"
          exit 1
