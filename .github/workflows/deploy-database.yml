name: Deploy Database

on:
  workflow_run:
    workflows: ["Build and Push to Docker Hub - Database"]
    types:
      - completed
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy-database:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success')

    env:
      REMOTE_WORKDIR: "/home/${{ secrets.SSH_USER }}/quetxal"
      REMOTE_COMPOSE: "/home/${{ secrets.SSH_USER }}/quetxal/docker-compose.db.yml"
      REMOTE_ENV: "/home/${{ secrets.SSH_USER }}/quetxal/.env.cloud"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Add gateway host key to runner known_hosts
          ssh-keyscan -H "${{ secrets.GATEWAY_VM_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Best-effort: obtain DB host key from gateway and add it (avoids interactive prompt)
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} "ssh-keyscan -H ${{ secrets.DATABASE_VM_IP }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify required secrets
        run: |
          : "${{ secrets.SSH_KEY }}" || { echo "SSH_KEY missing"; exit 1; }
          : "${{ secrets.SSH_USER }}" || { echo "SSH_USER missing"; exit 1; }
          : "${{ secrets.GATEWAY_VM_IP }}" || { echo "GATEWAY_VM_IP missing"; exit 1; }
          : "${{ secrets.DATABASE_VM_IP }}" || { echo "DATABASE_VM_IP missing"; exit 1; }
          : "${{ secrets.DOCKERHUB_USERNAME }}" || { echo "DOCKERHUB_USERNAME missing"; exit 1; }
          : "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "DOCKERHUB_TOKEN missing"; exit 1; }
        shell: bash

      - name: Ensure remote workdir and copy compose + backup script (via Gateway)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Add gateway host key to runner known_hosts
          ssh-keyscan -H "${{ secrets.GATEWAY_VM_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Ensure remote workdir exists (via Gateway)
          ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} "mkdir -p ${REMOTE_WORKDIR}/scripts && chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} ${REMOTE_WORKDIR} || true"

          # Copy docker-compose.db.yml to remote via Gateway
          scp -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            docker-compose.db.yml ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}:${REMOTE_COMPOSE}

          # Copy backup-databases.sh to remote via Gateway
          scp -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            scripts/backup-databases.sh ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}:${REMOTE_WORKDIR}/scripts/backup-databases.sh

          # Set executable permissions on backup script
          ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} "chmod +x ${REMOTE_WORKDIR}/scripts/backup-databases.sh"


      - name: Create env file from secrets and send to remote .env.cloud
        run: |
          cat > /tmp/.env.cloud <<EOF
          # Database Configuration
          AUTH_DB_NAME=${{ secrets.AUTH_DB_NAME }}
          AUTH_DB_USER=${{ secrets.AUTH_DB_USER }}
          AUTH_DB_PASSWORD=${{ secrets.AUTH_DB_PASSWORD }}
          AUTH_DB_PORT=${{ secrets.AUTH_DB_PORT }}

          SUBSCRIPTION_DB_NAME=${{ secrets.SUBSCRIPTION_DB_NAME }}
          SUBSCRIPTION_DB_USER=${{ secrets.SUBSCRIPTION_DB_USER }}
          SUBSCRIPTION_DB_PASSWORD=${{ secrets.SUBSCRIPTION_DB_PASSWORD }}
          SUBSCRIPTION_DB_PORT=${{ secrets.SUBSCRIPTION_DB_PORT }}

          CATALOG_DB_NAME=${{ secrets.CATALOG_DB_NAME }}
          CATALOG_DB_USER=${{ secrets.CATALOG_DB_USER }}
          CATALOG_DB_PASSWORD=${{ secrets.CATALOG_DB_PASSWORD }}
          CATALOG_DB_PORT=${{ secrets.CATALOG_DB_PORT }}

          RATING_DB_NAME=${{ secrets.RATING_DB_NAME }}
          RATING_DB_USER=${{ secrets.RATING_DB_USER }}
          RATING_DB_PASSWORD=${{ secrets.RATING_DB_PASSWORD }}
          RATING_DB_PORT=${{ secrets.RATING_DB_PORT }}

          FX_DB_NAME=${{ secrets.FX_DB_NAME }}
          FX_DB_USER=${{ secrets.FX_DB_USER }}
          FX_DB_PASSWORD=${{ secrets.FX_DB_PASSWORD }}
          FX_DB_PORT=${{ secrets.FX_DB_PORT }}

          HISTORY_DB_NAME=${{ secrets.HISTORY_DB_NAME }}
          HISTORY_DB_USER=${{ secrets.HISTORY_DB_USER }}
          HISTORY_DB_PASSWORD=${{ secrets.HISTORY_DB_PASSWORD }}
          HISTORY_DB_PORT=${{ secrets.HISTORY_DB_PORT }}

          NOTIFICATION_DB_NAME=${{ secrets.NOTIFICATION_DB_NAME }}
          NOTIFICATION_DB_USER=${{ secrets.NOTIFICATION_DB_USER }}
          NOTIFICATION_DB_PASSWORD=${{ secrets.NOTIFICATION_DB_PASSWORD }}
          NOTIFICATION_DB_PORT=${{ secrets.NOTIFICATION_DB_PORT }}

          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          EOF

          # Send to remote .env.cloud via Gateway
          ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} "cat > ${REMOTE_ENV}" < /tmp/.env.cloud

      - name: Deploy or update databases on VM (via Gateway)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} \
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME} DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN} SSH_USER=${SSH_USER} bash -s <<'EOF'
          set -euo pipefail

          WORKDIR="/home/${SSH_USER}/quetxal"
          COMPOSE_FILE="${WORKDIR}/docker-compose.db.yml"
          ENV_FILE="${WORKDIR}/.env.cloud"

          echo "=== Entering ${WORKDIR} ==="
          cd "${WORKDIR}" || { echo " Directory not found: ${WORKDIR}"; exit 2; }

          echo "=== Validating docker compose file ==="
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" config || { echo "❌ docker compose config failed"; exit 3; }

          echo "=== Docker Hub login on VM ==="
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

          echo "=== Pulling images (if available) ==="
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" pull || true

          echo "=== Stopping old containers (if any) ==="
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" down --remove-orphans || true

          echo "=== Starting containers ==="
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d

          echo "=== Waiting 30s for initialization ==="
          sleep 30

          echo "=== Containers status ==="
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" ps

          echo "=== Recent logs (tail 50) ==="
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" logs --tail=50
          EOF

      - name: Health check - Validate database connectivity
        continue-on-error: true
        run: |
          echo "Running health checks on databases..."
          ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} bash -s <<'EOF'
          set -euo pipefail
          WORKDIR="/home/${{ secrets.SSH_USER }}/quetxal"
          COMPOSE_FILE="${WORKDIR}/docker-compose.db.yml"
          ENV_FILE="${WORKDIR}/.env.cloud"
          cd "${WORKDIR}" || { echo " Directory not found: ${WORKDIR}"; exit 2; }

          echo "=== Checking PostgreSQL databases ==="
          for db in auth subscription catalog rating fx history notification; do
            CONTAINER="quetxal-${db}-db"
            echo "-> Checking ${CONTAINER}..."
            if docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" exec -T ${CONTAINER} pg_isready -U ${db}_user 2>/dev/null; then
              echo "✓ ${db} database is ready"
            else
              echo "✗ ${db} database is NOT ready"
            fi
          done

          echo "=== Checking Redis ==="
          if docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" exec -T quetxal-redis redis-cli -a $(grep '^REDIS_PASSWORD=' ${ENV_FILE} | cut -d'=' -f2) ping 2>/dev/null | grep PONG; then
            echo "✓ Redis is ready"
          else
            echo "✗ Redis is NOT ready"
          fi
          EOF

      - name: Create backup after deployment
        continue-on-error: true
        run: |
          echo "Creating initial database backup..."
          ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} bash -s <<'EOF'
          set -euo pipefail
          if [ -f /home/${{ secrets.SSH_USER }}/quetxal/scripts/backup-databases.sh ]; then
            echo "Running backup script..."
            bash /home/${{ secrets.SSH_USER }}/quetxal/scripts/backup-databases.sh
            echo "Backup completed"
          else
            echo "No backup script found; skipping."
          fi
          EOF

      - name: Notify deployment
        if: always()
        run: |
          echo "✅ Database deployment completed"
          echo "Database VM: ${{ secrets.DATABASE_VM_IP }}"
          echo "Check status: ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} and run 'docker compose -f /home/${{ secrets.SSH_USER }}/quetxal/docker-compose.db.yml ps'"

      - name: Notify failure
        if: failure()
        run: |
          echo " Database deployment failed"
          echo "SSH to Database VM: ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}"
          echo "Check logs: docker compose -f /home/${{ secrets.SSH_USER }}/quetxal/docker-compose.db.yml logs"
          exit 1
