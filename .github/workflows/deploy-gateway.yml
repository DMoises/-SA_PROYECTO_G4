name: Deploy Gateway

on:
  push:
    branches:
      - develop
      - main
      - feature/despliegue
  workflow_dispatch:

env:
  GCR_REGISTRY: gcr.io

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.GATEWAY_VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify required secrets
        run: |
          : "${{ secrets.SSH_KEY }}" || { echo "SSH_KEY missing"; exit 1; }
          : "${{ secrets.SSH_USER }}" || { echo "SSH_USER missing"; exit 1; }
          : "${{ secrets.GCP_PROJECT_ID }}" || { echo "GCP_PROJECT_ID missing"; exit 1; }
          : "${{ secrets.GATEWAY_VM_IP }}" || { echo "GATEWAY_VM_IP missing"; exit 1; }
        shell: bash

      - name: Deploy on Gateway VM
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCR_REGISTRY: ${{ env.GCR_REGISTRY }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} GCR_REGISTRY=gcr.io SSH_USER=${{ secrets.SSH_USER }} bash -s << 'EOF'
          set -euo pipefail

          # Variables
          PROJECT_ID="${GCP_PROJECT_ID}"
          IMAGE="${GCR_REGISTRY}/${PROJECT_ID}/api-gateway:latest"
          WORKDIR="/home/${SSH_USER}/quetxal"
          COMPOSE_FILE="${WORKDIR}/docker-compose.gateway.yml"

          echo "=== Entrando a ${WORKDIR} ==="
          cd "${WORKDIR}" || { echo "Directorio no encontrado: ${WORKDIR}"; exit 2; }

          # Si gcloud está instalado, autenticar docker para GCR (silencioso si ya autenticado)
          if command -v gcloud >/dev/null 2>&1; then
            echo "=== gcloud detectado: configurando docker para GCR ==="
            gcloud auth configure-docker gcr.io --quiet || true
          else
            echo "=== gcloud no instalado en la VM: se intentará pull directo (si está permitido) ==="
          fi

          echo "=== Intentando descargar la imagen: ${IMAGE} ==="
          # Intentar pull; si falla, mostrar tags disponibles (si gcloud está presente)
          if docker pull "${IMAGE}"; then
            echo "✅ Imagen descargada: ${IMAGE}"
          else
            echo "⚠️ Falló docker pull ${IMAGE}"
            if command -v gcloud >/dev/null 2>&1; then
              echo "Listando tags en GCR para diagnóstico..."
              gcloud container images list-tags "${GCR_REGISTRY}/${PROJECT_ID}/api-gateway" --limit=5 --format='get(tags,digest,timestamp)'
            fi
            exit 3
          fi

          # Mostrar digest de la imagen descargada para verificación
          echo "=== Digest de la imagen descargada ==="
          docker inspect --format='{{index .RepoDigests 0}}' "${GCR_REGISTRY}/${PROJECT_ID}/api-gateway:latest" || true

          # Parar y arrancar con docker-compose de forma segura
          echo "=== Parando contenedores antiguos (si existen) ==="
          docker-compose -f "${COMPOSE_FILE}" down || true

          echo "=== Actualizando servicios con pull y up ==="
          docker-compose -f "${COMPOSE_FILE}" pull || true
          docker-compose -f "${COMPOSE_FILE}" up -d --remove-orphans

          echo "=== Esperando arranque ==="
          sleep 5

          echo "=== Estado de contenedores ==="
          docker-compose -f "${COMPOSE_FILE}" ps

          echo "=== Últimos logs (limitados) ==="
          docker-compose -f "${COMPOSE_FILE}" logs --tail=50

          EOF

      - name: Health check
        continue-on-error: true
        run: |
          echo "Comprobando salud del Gateway..."
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.GATEWAY_VM_IP }}:80/health || true)
            if [ "$status" = "200" ]; then
              echo "✅ Gateway responde con 200"
              exit 0
            fi
            echo "Intento $i/12 - estado HTTP: ${status}"
            sleep 5
          done
          echo "⚠️ Health check no obtuvo 200 tras varios intentos"

      - name: Notify deployment
        if: always()
        run: |
          echo "✅ Gateway deployment finished"
          echo "Gateway URL: http://${{ secrets.GATEWAY_VM_IP }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Gateway deployment failed"
          exit 1