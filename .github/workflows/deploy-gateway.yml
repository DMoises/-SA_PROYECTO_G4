name: Deploy Gateway

on:
  workflow_run:
    workflows: 
      - "Build and Push to Docker Hub - Gateway"
      - "Build and Push to Docker Hub - Frontend"
    types:
      - completed
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.GATEWAY_VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify required secrets
        run: |
          : "${{ secrets.SSH_KEY }}" || { echo "SSH_KEY missing"; exit 1; }
          : "${{ secrets.SSH_USER }}" || { echo "SSH_USER missing"; exit 1; }
          : "${{ secrets.GATEWAY_VM_IP }}" || { echo "GATEWAY_VM_IP missing"; exit 1; }
          : "${{ secrets.SERVICES_VM_IP }}" || { echo "SERVICES_VM_IP missing"; exit 1; }
          : "${{ secrets.DOCKERHUB_USERNAME }}" || { echo "DOCKERHUB_USERNAME missing"; exit 1; }
          : "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "DOCKERHUB_TOKEN missing"; exit 1; }
        shell: bash

      - name: Transferir Docker Compose a la VM de GCP
        run: |
          echo "=== 📤 Transfiriendo docker-compose.gateway.yml a la VM ==="
          # Aseguramos que el directorio destino exista antes de copiar
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} "mkdir -p /home/${{ secrets.SSH_USER }}/quetxal"
          
          # Copiamos el archivo compose desde el runner hacia la VM
          scp -i ~/.ssh/id_ed25519 docker-compose.gateway.yml ${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }}:/home/${{ secrets.SSH_USER }}/quetxal/docker-compose.gateway.yml

      - name: Deploy on Gateway VM via SSH
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVICES_VM_IP: ${{ secrets.SERVICES_VM_IP }}
          GATEWAY_VM_IP: ${{ secrets.GATEWAY_VM_IP }}
          DATABASE_VM_IP: ${{ secrets.DATABASE_VM_IP }}
          GATEWAY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/quetxal-api-gateway:latest
          AUTH_DB_NAME: ${{ secrets.AUTH_DB_NAME || 'auth_db' }}
          AUTH_DB_USER: ${{ secrets.AUTH_DB_USER || 'auth_user' }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
          SUBSCRIPTION_DB_NAME: ${{ secrets.SUBSCRIPTION_DB_NAME || 'subscription_db' }}
          SUBSCRIPTION_DB_USER: ${{ secrets.SUBSCRIPTION_DB_USER || 'subscription_user' }}
          SUBSCRIPTION_DB_PASSWORD: ${{ secrets.SUBSCRIPTION_DB_PASSWORD }}
          CATALOG_DB_NAME: ${{ secrets.CATALOG_DB_NAME || 'catalog_db' }}
          CATALOG_DB_USER: ${{ secrets.CATALOG_DB_USER || 'catalog_user' }}
          CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
          RATING_DB_NAME: ${{ secrets.RATING_DB_NAME || 'rating_db' }}
          RATING_DB_USER: ${{ secrets.RATING_DB_USER || 'rating_user' }}
          RATING_DB_PASSWORD: ${{ secrets.RATING_DB_PASSWORD }}
          FX_DB_NAME: ${{ secrets.FX_DB_NAME || 'fx_db' }}
          FX_DB_USER: ${{ secrets.FX_DB_USER || 'fx_user' }}
          FX_DB_PASSWORD: ${{ secrets.FX_DB_PASSWORD }}
          HISTORY_DB_NAME: ${{ secrets.HISTORY_DB_NAME || 'history_db' }}
          HISTORY_DB_USER: ${{ secrets.HISTORY_DB_USER || 'history_user' }}
          HISTORY_DB_PASSWORD: ${{ secrets.HISTORY_DB_PASSWORD }}
          NOTIFICATION_DB_NAME: ${{ secrets.NOTIFICATION_DB_NAME || 'notification_db' }}
          NOTIFICATION_DB_USER: ${{ secrets.NOTIFICATION_DB_USER || 'notification_user' }}
          NOTIFICATION_DB_PASSWORD: ${{ secrets.NOTIFICATION_DB_PASSWORD }}
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME} \
            DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN} \
            SSH_USER=${SSH_USER} \
            SERVICES_VM_IP=${SERVICES_VM_IP} \
            GATEWAY_VM_IP=${GATEWAY_VM_IP} \
            DATABASE_VM_IP=${DATABASE_VM_IP} \
            GATEWAY_IMAGE=${GATEWAY_IMAGE} \
            AUTH_DB_NAME=${AUTH_DB_NAME} \
            AUTH_DB_USER=${AUTH_DB_USER} \
            AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD} \
            SUBSCRIPTION_DB_NAME=${SUBSCRIPTION_DB_NAME} \
            SUBSCRIPTION_DB_USER=${SUBSCRIPTION_DB_USER} \
            SUBSCRIPTION_DB_PASSWORD=${SUBSCRIPTION_DB_PASSWORD} \
            CATALOG_DB_NAME=${CATALOG_DB_NAME} \
            CATALOG_DB_USER=${CATALOG_DB_USER} \
            CATALOG_DB_PASSWORD=${CATALOG_DB_PASSWORD} \
            RATING_DB_NAME=${RATING_DB_NAME} \
            RATING_DB_USER=${RATING_DB_USER} \
            RATING_DB_PASSWORD=${RATING_DB_PASSWORD} \
            FX_DB_NAME=${FX_DB_NAME} \
            FX_DB_USER=${FX_DB_USER} \
            FX_DB_PASSWORD=${FX_DB_PASSWORD} \
            HISTORY_DB_NAME=${HISTORY_DB_NAME} \
            HISTORY_DB_USER=${HISTORY_DB_USER} \
            HISTORY_DB_PASSWORD=${HISTORY_DB_PASSWORD} \
            NOTIFICATION_DB_NAME=${NOTIFICATION_DB_NAME} \
            NOTIFICATION_DB_USER=${NOTIFICATION_DB_USER} \
            NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD} bash -s << 'EOF'
          set -euo pipefail

          # Variables de Entorno Locales en la VM
          IMAGE="${DOCKERHUB_USERNAME}/quetxal-api-gateway:latest"
          WORKDIR="/home/${SSH_USER}/quetxal"
          COMPOSE_FILE="${WORKDIR}/docker-compose.gateway.yml"

          echo "=== Entrando a ${WORKDIR} ==?"
          cd "${WORKDIR}" || { echo "❌ Directorio no encontrado: ${WORKDIR}"; exit 2; }

          echo "=== Autenticando en Docker Hub desde la VM ==="
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

          echo "=== Descargando la imagen actualizada: ${IMAGE} ==="
          if docker pull "${IMAGE}"; then
            echo "✅ Imagen descargada con éxito de Docker Hub"
          else
            echo "❌ Falló docker pull de ${IMAGE}"
            exit 3
          fi

          FRONTEND_IMAGE="${DOCKERHUB_USERNAME}/quetxal-frontend:latest"
          echo "=== Descargando la imagen del frontend: ${FRONTEND_IMAGE} ==="
          if docker pull "${FRONTEND_IMAGE}"; then
            echo "✅ Imagen del frontend descargada con éxito"
          else
            echo "⚠️ No se pudo descargar la imagen del frontend o no existe todavía."
          fi

          echo "=== Re-desplegando el contenedor del API Gateway y Frontend ==="
          export GATEWAY_VM_IP="${GATEWAY_VM_IP}"
          export GATEWAY_IMAGE="${IMAGE}"
          export AUTH_SERVICE_ADDR="${SERVICES_VM_IP}:50051"
          export HISTORY_SERVICE_ADDR="${SERVICES_VM_IP}:50057"
          export CATALOG_SERVICE_ADDR="${SERVICES_VM_IP}:50055"
          export NOTIFICATION_SERVICE_ADDR="${SERVICES_VM_IP}:50054"
          export RATING_SERVICE_ADDR="${SERVICES_VM_IP}:50056"
          export FX_SERVICE_ADDR="${SERVICES_VM_IP}:50053"
          export BILLING_SERVICE_ADDR="${SERVICES_VM_IP}:50052"
          export WATCHPARTY_SERVICE_ADDR="${SERVICES_VM_IP}:50059"
          export WATCHPARTY_WS_ADDR="${SERVICES_VM_IP}:8085"
          export CATALOG_ADMIN_HTTP_ADDR="http://${SERVICES_VM_IP}:8086"
          export CORS_ORIGIN="http://${GATEWAY_VM_IP}"
          export DATABASE_VM_IP="${DATABASE_VM_IP}"
          export AUTH_DB_NAME="${AUTH_DB_NAME}"
          export AUTH_DB_USER="${AUTH_DB_USER}"
          export AUTH_DB_PASSWORD="${AUTH_DB_PASSWORD}"
          export SUBSCRIPTION_DB_NAME="${SUBSCRIPTION_DB_NAME}"
          export SUBSCRIPTION_DB_USER="${SUBSCRIPTION_DB_USER}"
          export SUBSCRIPTION_DB_PASSWORD="${SUBSCRIPTION_DB_PASSWORD}"
          export CATALOG_DB_NAME="${CATALOG_DB_NAME}"
          export CATALOG_DB_USER="${CATALOG_DB_USER}"
          export CATALOG_DB_PASSWORD="${CATALOG_DB_PASSWORD}"
          export RATING_DB_NAME="${RATING_DB_NAME}"
          export RATING_DB_USER="${RATING_DB_USER}"
          export RATING_DB_PASSWORD="${RATING_DB_PASSWORD}"
          export FX_DB_NAME="${FX_DB_NAME}"
          export FX_DB_USER="${FX_DB_USER}"
          export FX_DB_PASSWORD="${FX_DB_PASSWORD}"
          export HISTORY_DB_NAME="${HISTORY_DB_NAME}"
          export HISTORY_DB_USER="${HISTORY_DB_USER}"
          export HISTORY_DB_PASSWORD="${HISTORY_DB_PASSWORD}"
          export NOTIFICATION_DB_NAME="${NOTIFICATION_DB_NAME}"
          export NOTIFICATION_DB_USER="${NOTIFICATION_DB_USER}"
          export NOTIFICATION_DB_PASSWORD="${NOTIFICATION_DB_PASSWORD}"
          docker-compose -f "${COMPOSE_FILE}" down --remove-orphans || true
          docker-compose -f "${COMPOSE_FILE}" up -d

          echo "=== Esperando estabilización del proceso (5s) ==="
          sleep 5

          echo "=== Estado de los contenedores desplegados ==="
          docker-compose -f "${COMPOSE_FILE}" ps

          echo "=== Limpieza de sistema Docker para optimizar almacenamiento ==="
          docker system prune -af || true
          
          EOF

      - name: Health check
        continue-on-error: true
        run: |
          echo "Comprobando salud del Gateway en el puerto expuesto..."
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.GATEWAY_VM_IP }}:80/health || true)
            if [ "$status" = "200" ]; then
              echo "✅ El API Gateway responde con HTTP 200 OK"
              exit 0
            fi
            echo "Intento $i/12 - estado HTTP obtenido: ${status}"
            sleep 5
          done
          echo "⚠️ El Health check falló. El contenedor no está respondiendo en el puerto 80."
          exit 1