name: Deploy to Kubernetes (GKE)

on:
  # Despliegue AUTOMÁTICO: se encadena cuando el pipeline de release termina de
  # construir y publicar las imágenes versionadas (garantiza que :vX.Y.Z ya existe).
  workflow_run:
    workflows: ["Release - Build & Push Versión Semántica (vX.Y.Z)"]
    types: [completed]
  # Despliegue MANUAL: desplegar/re-desplegar un tag de versión específico a demanda
  # (útil para rollback puntual a una versión estable anterior).
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag de versión a desplegar (ej. v2.0.0)'
        required: true
  # Despliegue REUTILIZABLE: lo invoca infra-up.yml tras un `terraform apply` para
  # que un rebuild deje la app en GKE sin pasos manuales (no necesita PAT: corre en
  # el mismo contexto del caller con `secrets: inherit`).
  workflow_call:
    inputs:
      version:
        description: 'Tag de versión a desplegar (ej. v2.0.0)'
        required: true
        type: string

# A nivel workflow: la llamada reutilizable (bootstrap -> provision-infra) hereda el
# techo de permisos del WORKFLOW, no del job. Sin esto -> startup_failure.
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: quetxal-cluster    # IMPORTANTE: Cambia esto por el nombre real de tu clúster en GCP
  GKE_ZONE: us-central1-a         # IMPORTANTE: Cambia esto por la zona de tu clúster

jobs:
  # ---------------------------------------------------------------------------
  # PRE-VUELO: ¿existe la plataforma (cluster de GKE)? Si no, se aprovisiona antes
  # de desplegar. Así un `terraform destroy` no rompe el flujo: cualquier deploy
  # se auto-reconstruye (crea-si-falta) en vez de fallar por "no existe".
  # ---------------------------------------------------------------------------
  precheck:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      cluster_missing: ${{ steps.check.outputs.missing }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: ¿Existe el cluster de GKE?
        id: check
        run: |
          if gcloud container clusters describe "${{ env.GKE_CLUSTER }}" \
               --zone "${{ env.GKE_ZONE }}" --project "${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "✓ Cluster ${{ env.GKE_CLUSTER }} existe — se despliega directo."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "✗ Cluster ${{ env.GKE_CLUSTER }} NO existe — se aprovisionará la plataforma primero."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

  # Si la plataforma no existe, la crea (terraform apply + ansible) ANTES del deploy.
  # provision-infra es una hoja (no invoca a deploy-k8s) => sin recursión.
  bootstrap:
    needs: precheck
    if: ${{ needs.precheck.outputs.cluster_missing == 'true' }}
    uses: ./.github/workflows/provision-infra.yml
    with:
      run_ansible: true
    secrets: inherit

  deploy-to-gke:
    needs: [precheck, bootstrap]
    # Corre si: el evento es válido (release/dispatch/call), el precheck pasó, y el
    # bootstrap tuvo éxito O se saltó (la plataforma ya existía).
    if: >-
      ${{ always()
      && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event.workflow_run.conclusion == 'success')
      && needs.precheck.result == 'success'
      && (needs.bootstrap.result == 'success' || needs.bootstrap.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # En el deploy automático tomamos el commit exacto del release; en el manual, la rama actual.
        ref: ${{ github.event.workflow_run.head_sha || github.ref }}
        # Traemos historial + tags: la versión del release se resuelve por el tag
        # SemVer que release.yml creó sobre ESTE commit (ver paso siguiente).
        fetch-depth: 0
        fetch-tags: true

    - name: Resolver versión a desplegar
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
          # Tanto el dispatch manual como la invocación reutilizable (infra-up)
          # pasan la versión por inputs.version.
          VERSION="${{ inputs.version }}"
        else
          # Encadenado desde release.yml. OJO: en un workflow_run anidado
          # (CI -> release -> deploy) github.event.workflow_run.head_branch suele
          # llegar como 'develop' y NO como 'release/vX.Y.Z', así que NO podemos
          # confiar en él (este era el bug que rompía el auto-deploy del release).
          #
          # Fuente de verdad robusta: el tag SemVer que release.yml creó y pusheó
          # sobre ESTE mismo commit. Lo leemos con git tag --points-at HEAD.
          REF="${{ github.event.workflow_run.head_branch }}"
          git fetch --tags --force --quiet || true
          VERSION="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"

          # Fallbacks si el tag aún no estuviera visible: rama release/vX.Y.Z directa.
          if [ -z "$VERSION" ]; then
            if [[ "$REF" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
            elif [ "$REF" = "release" ]; then
              VERSION="$(tr -d '[:space:]' < VERSION)"
            fi
          fi

          if [ -z "$VERSION" ]; then
            echo "❌ ERROR: no pude resolver la versión a desplegar (sin tag SemVer sobre HEAD y REF='$REF' no es una rama release). Dispará el deploy manualmente con el input 'version'."; exit 1
          fi
        fi
        if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "❌ ERROR: '$VERSION' no es un Tag semántico válido (vX.Y.Z)"; exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "🚀 Desplegando versión $VERSION en GKE"
      shell: bash

    # 1. Autenticación contra Google Cloud Platform
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
        service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

    # 2. Configurar el CLI de Kubernetes (kubectl)
    - name: Set up GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    # 3. Inyectar Secretos de Github Actions en la plantilla secrets.yaml
    - name: Inject Secrets into Manifest
      run: |
        # Exportamos todos los secretos necesarios para el comando envsubst
        export AUTH_DB_NAME="${{ secrets.AUTH_DB_NAME }}"
        export AUTH_DB_USER="${{ secrets.AUTH_DB_USER }}"
        export AUTH_DB_PASSWORD="${{ secrets.AUTH_DB_PASSWORD }}"
        
        export SUBSCRIPTION_DB_NAME="${{ secrets.SUBSCRIPTION_DB_NAME }}"
        export SUBSCRIPTION_DB_USER="${{ secrets.SUBSCRIPTION_DB_USER }}"
        export SUBSCRIPTION_DB_PASSWORD="${{ secrets.SUBSCRIPTION_DB_PASSWORD }}"
        
        export CATALOG_DB_NAME="${{ secrets.CATALOG_DB_NAME }}"
        export CATALOG_DB_USER="${{ secrets.CATALOG_DB_USER }}"
        export CATALOG_DB_PASSWORD="${{ secrets.CATALOG_DB_PASSWORD }}"
        
        export RATING_DB_NAME="${{ secrets.RATING_DB_NAME }}"
        export RATING_DB_USER="${{ secrets.RATING_DB_USER }}"
        export RATING_DB_PASSWORD="${{ secrets.RATING_DB_PASSWORD }}"
        
        export FX_DB_NAME="${{ secrets.FX_DB_NAME }}"
        export FX_DB_USER="${{ secrets.FX_DB_USER }}"
        export FX_DB_PASSWORD="${{ secrets.FX_DB_PASSWORD }}"
        
        export HISTORY_DB_NAME="${{ secrets.HISTORY_DB_NAME }}"
        export HISTORY_DB_USER="${{ secrets.HISTORY_DB_USER }}"
        export HISTORY_DB_PASSWORD="${{ secrets.HISTORY_DB_PASSWORD }}"
        
        export NOTIFICATION_DB_NAME="${{ secrets.NOTIFICATION_DB_NAME }}"
        export NOTIFICATION_DB_USER="${{ secrets.NOTIFICATION_DB_USER }}"
        export NOTIFICATION_DB_PASSWORD="${{ secrets.NOTIFICATION_DB_PASSWORD }}"
        
        export REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        
        export FX_API_URL="${{ secrets.FX_API_URL }}"
        export FX_API_TIMEOUT="${{ secrets.FX_API_TIMEOUT }}"
        export FX_CACHE_TTL="${{ secrets.FX_CACHE_TTL }}"
        
        export SMTP_HOST="${{ secrets.SMTP_HOST }}"
        export SMTP_USER="${{ secrets.SMTP_USER }}"
        export SMTP_PASS="${{ secrets.SMTP_PASS }}"
        export SMTP_FROM="${{ secrets.SMTP_FROM }}"
        
        export GCS_ACCESS_KEY="${{ secrets.GCS_ACCESS_KEY }}"
        export GCS_SECRET_KEY="${{ secrets.GCS_SECRET_KEY }}"
        export GCS_BUCKET_NAME="${{ secrets.GCS_BUCKET_NAME }}"
        
        # Sustituimos las variables del archivo base y lo guardamos temporalmente
        envsubst < k8s/base/secrets.yaml > k8s/base/secrets-injected.yaml
        
        # Ocultamos la impresión en la consola para no revelar contraseñas
        echo "Secretos inyectados correctamente en los manifiestos."

    # 4. Ajustar el Registry y PINEAR la versión de las imágenes (no :latest)
    - name: Set Docker Registry y pinear versión
      env:
        DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Pinea SOLO las imágenes propias: tu-registro/quetxal-XXX:latest -> DH_USER/quetxal-XXX:VERSION
        # Así cada release es una revisión distinta y el `kubectl rollout undo` puede volver a una versión estable real.
        find k8s -type f -name "*.yaml" -exec sed -i \
          "s|tu-registro/\(quetxal-[a-z0-9-]*\):latest|${DH_USER}/\1:${VERSION}|g" {} +
        # Cualquier referencia restante al placeholder (sin :latest) toma el usuario real.
        find k8s -type f -name "*.yaml" -exec sed -i "s|tu-registro|${DH_USER}|g" {} +
        echo "✅ Manifiestos apuntando a ${DH_USER}/quetxal-*:${VERSION}"

    # 5. Desplegar Infraestructura en Kubernetes
    - name: Deploy Base infrastructure (Namespace, ConfigMap, Secrets)
      run: |
        kubectl apply -f k8s/base/namespace.yaml
        kubectl apply -f k8s/base/configmap.yaml
        kubectl apply -f k8s/base/secrets-injected.yaml

    - name: Deploy External Database Services (Endpoints -> VM de BD)
      run: |
        # Persistencia AISLADA (Fase 3): las bases YA NO corren en Pods. Esto sólo
        # crea los Services + Endpoints que enrutan auth-db:5432, catalog-db:5432, …
        # hacia la VM externa quetxal-database-vm.
        kubectl apply -f k8s/databases/external-databases.yaml

    - name: Deploy Microservices and API Gateway
      run: |
        kubectl apply -f k8s/microservices/
        kubectl apply -f k8s/api-gateway.yaml

    - name: Deploy CronJobs (mantenimiento/depuración)
      run: |
        kubectl apply -f k8s/cronjobs/

    # Controlador ingress-nginx: en un cluster nuevo (tras destroy/recreate) no existe.
    # Lo instalamos de forma idempotente y esperamos a que el LoadBalancer esté listo,
    # ANTES de aplicar nuestras reglas de Ingress. Versión pineada (controller-v1.11.2).
    - name: Ensure ingress-nginx controller
      run: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/cloud/deploy.yaml
        echo "Esperando a que el webhook/controlador de ingress-nginx esté disponible..."
        kubectl wait --namespace ingress-nginx \
          --for=condition=Available deployment/ingress-nginx-controller \
          --timeout=240s
        # El job de admisión puede tardar en registrar el webhook; pequeña espera defensiva.
        kubectl wait --namespace ingress-nginx \
          --for=condition=Complete job/ingress-nginx-admission-create \
          --timeout=120s || true

    - name: Expose Ingress Rules
      run: |
        kubectl apply -f k8s/ingress.yaml

    # Stack de Observabilidad de Métricas (Prometheus + Grafana) en la nube.
    # Prometheus scrapea el cluster (nodos, cAdvisor, pods) y las VMs externas
    # (node_exporter en 10.10.0.10/.2/.3:9100); Grafana muestra los dashboards de
    # hardware y red. Es additivo (namespace 'monitoring') y NO debe tumbar la app:
    # continue-on-error evita que un fallo aquí dispare el Rollback automático.
    - name: Deploy Observability Stack (Prometheus + Grafana)
      continue-on-error: true
      env:
        GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      run: |
        kubectl apply -k k8s/monitoring
        # Password de admin de Grafana vía Secret (si está el GitHub Secret).
        # Si no, Grafana arranca con su credencial por defecto (grafana-admin es optional).
        if [ -n "${GRAFANA_ADMIN_PASSWORD}" ]; then
          kubectl create secret generic grafana-admin -n monitoring \
            --from-literal=password="${GRAFANA_ADMIN_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart deployment/grafana -n monitoring
        fi
        kubectl rollout status deployment/prometheus -n monitoring --timeout=150s || echo "⚠️ prometheus aún no listo"
        kubectl rollout status deployment/grafana -n monitoring --timeout=150s || echo "⚠️ grafana aún no listo"

    # Stack de Observabilidad de LOGS: DaemonSet de Filebeat que recolecta los logs
    # de todos los pods y los envía a Logstash en la VM de ELK (10.10.0.20:5044).
    # Additivo (namespace 'logging'); continue-on-error para no tumbar la app.
    - name: Deploy Log Shipper (Filebeat DaemonSet -> ELK)
      continue-on-error: true
      run: |
        kubectl apply -f k8s/logging/
        kubectl rollout status daemonset/filebeat -n logging --timeout=150s || echo "⚠️ filebeat aún no listo"

    - name: Clean up temporary secrets
      run: rm k8s/base/secrets-injected.yaml

    - name: Verify Deployment Success (Rollout Status)
      run: |
        # 1) Bases de datos EXTERNAS (VM de GCE): no hay Pods que esperar; verificamos
        #    que cada Service tenga su Endpoint apuntando a la VM antes de seguir.
        echo "Verificando Endpoints de las bases de datos externas..."
        for DB in auth-db subscription-db catalog-db rating-db fx-db history-db notification-db redis; do
          EP=$(kubectl get endpoints "$DB" -n quetxal-tv-prod -o jsonpath='{.subsets[0].addresses[0].ip}:{.subsets[0].ports[0].port}' 2>/dev/null)
          if echo "$EP" | grep -qE '^[0-9]+\.'; then
            echo "✓ $DB -> $EP"
          else
            echo "✗ $DB no tiene Endpoint hacia la VM de BD"; exit 1
          fi
        done
        # 2) Luego los microservicios. Timeout amplio (240s): un redeploy de toda la malla
        #    tarda mucho mas de 60s y 60s disparaba un Rollback en falso.
        SERVICES=("auth-service" "billing-service" "catalog-service" "rating-service" "frontend" "fx-service" "history-service" "notification-service")
        for SERVICE in "${SERVICES[@]}"; do
          echo "Verificando estado de $SERVICE..."
          kubectl rollout status deployment/$SERVICE -n quetxal-tv-prod --timeout=240s
        done
        
    - name: Automatic Rollback on Failure
      if: failure()
      run: |
        echo "🚨 Falla detectada en el despliegue. Iniciando Rollback automático..."
        SERVICES=("auth-service" "billing-service" "catalog-service" "rating-service" "frontend" "fx-service" "history-service" "notification-service")
        for SERVICE in "${SERVICES[@]}"; do
          echo "Revirtiendo $SERVICE..."
          kubectl rollout undo deployment/$SERVICE -n quetxal-tv-prod || true
        done
        exit 1
