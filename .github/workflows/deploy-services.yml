name: Deploy Microservices

on:
  workflow_run:
    workflows: ["Build and Push to Docker Hub - Services"]
    types:
      - completed
    branches:
      - develop
      - main
      - feature/despliegue
  workflow_dispatch:

jobs:
  deploy-services:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    env:
      REMOTE_WORKDIR: "/home/${{ secrets.SSH_USER }}/quetxal"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          : "${{ secrets.SSH_KEY }}" || { echo "❌ ERROR: SSH_KEY no configurado"; exit 1; }
          : "${{ secrets.SSH_USER }}" || { echo "❌ ERROR: SSH_USER no configurado"; exit 1; }
          : "${{ secrets.GATEWAY_VM_IP }}" || { echo "❌ ERROR: GATEWAY_VM_IP no configurado"; exit 1; }
          : "${{ secrets.SERVICES_VM_IP }}" || { echo "❌ ERROR: SERVICES_VM_IP no configurado"; exit 1; }
          : "${{ secrets.DATABASE_VM_IP }}" || { echo "❌ ERROR: DATABASE_VM_IP no configurado"; exit 1; }
          : "${{ secrets.DOCKERHUB_USERNAME }}" || { echo "❌ ERROR: DOCKERHUB_USERNAME no configurado"; exit 1; }
          : "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "❌ ERROR: DOCKERHUB_TOKEN no configurado"; exit 1; }
        shell: bash

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add gateway host key to runner known_hosts
          ssh-keyscan -H "${{ secrets.GATEWAY_VM_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Best-effort: obtain Services host key from gateway and add it (avoids interactive prompt)
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} "ssh-keyscan -H ${{ secrets.SERVICES_VM_IP }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure remote workdir and copy compose (via Gateway)
        run: |
          # Ensure remote workdir exists (via Gateway)
          ssh -i ~/.ssh/id_rsa -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVICES_VM_IP }} "mkdir -p ${REMOTE_WORKDIR} && chown ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} ${REMOTE_WORKDIR} || true"

          # Copy docker-compose.services.yml to remote via Gateway
          scp -i ~/.ssh/id_rsa -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            docker-compose.services.yml ${{ secrets.SSH_USER }}@${{ secrets.SERVICES_VM_IP }}:${REMOTE_WORKDIR}/docker-compose.services.yml

      - name: Create environment file
        run: |
          cat > /tmp/.env.services << 'EOF'
          # Database configuration (VM3 internal IP)
          DB_VM_HOST=${{ secrets.DATABASE_VM_IP }}
          DB_PORT=5432

          # Redis configuration (VM3 internal IP)
          REDIS_HOST=${{ secrets.DATABASE_VM_IP }}
          REDIS_PORT=6379

          # Docker Hub Configuration
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

          # Database credentials
          AUTH_DB_NAME=${{ secrets.AUTH_DB_NAME || 'auth_db' }}
          AUTH_DB_USER=${{ secrets.AUTH_DB_USER || 'auth_user' }}
          AUTH_DB_PASSWORD=${{ secrets.AUTH_DB_PASSWORD }}

          SUBSCRIPTION_DB_NAME=${{ secrets.SUBSCRIPTION_DB_NAME || 'subscription_db' }}
          SUBSCRIPTION_DB_USER=${{ secrets.SUBSCRIPTION_DB_USER || 'subscription_user' }}
          SUBSCRIPTION_DB_PASSWORD=${{ secrets.SUBSCRIPTION_DB_PASSWORD }}

          CATALOG_DB_NAME=${{ secrets.CATALOG_DB_NAME || 'catalog_db' }}
          CATALOG_DB_USER=${{ secrets.CATALOG_DB_USER || 'catalog_user' }}
          CATALOG_DB_PASSWORD=${{ secrets.CATALOG_DB_PASSWORD }}

          RATING_DB_NAME=${{ secrets.RATING_DB_NAME || 'rating_db' }}
          RATING_DB_USER=${{ secrets.RATING_DB_USER || 'rating_user' }}
          RATING_DB_PASSWORD=${{ secrets.RATING_DB_PASSWORD }}

          FX_DB_NAME=${{ secrets.FX_DB_NAME || 'fx_db' }}
          FX_DB_USER=${{ secrets.FX_DB_USER || 'fx_user' }}
          FX_DB_PASSWORD=${{ secrets.FX_DB_PASSWORD }}

          HISTORY_DB_NAME=${{ secrets.HISTORY_DB_NAME || 'history_db' }}
          HISTORY_DB_USER=${{ secrets.HISTORY_DB_USER || 'history_user' }}
          HISTORY_DB_PASSWORD=${{ secrets.HISTORY_DB_PASSWORD }}

          NOTIFICATION_DB_NAME=${{ secrets.NOTIFICATION_DB_NAME || 'notification_db' }}
          NOTIFICATION_DB_USER=${{ secrets.NOTIFICATION_DB_USER || 'notification_user' }}
          NOTIFICATION_DB_PASSWORD=${{ secrets.NOTIFICATION_DB_PASSWORD }}

          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF

      - name: Copy environment file to Services VM (via Gateway)
        run: |
          scp -i ~/.ssh/id_rsa -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            /tmp/.env.services ${{ secrets.SSH_USER }}@${{ secrets.SERVICES_VM_IP }}:${REMOTE_WORKDIR}/.env.cloud

      - name: Pull latest images and deploy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_rsa -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVICES_VM_IP }} \
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME} \
            DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN} bash -s << 'EOF'
          set -e
          cd /home/${{ secrets.SSH_USER }}/quetxal

          echo "=== Authenticating with Docker Hub ==="
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

          echo "=== Pulling latest microservice images ==="
          SERVICES=("auth-service" "notification-service" "billing-service" "catalog-service" "fx-service" "rating-service" "history-service")
          for service in "${SERVICES[@]}"; do
            docker pull ${DOCKERHUB_USERNAME}/quetxal-${service}:latest || true
          done

          echo "=== Stopping old containers ==="
          docker-compose -f docker-compose.services.yml --env-file .env.cloud down || true

          echo "=== Starting new containers ==="
          docker-compose -f docker-compose.services.yml --env-file .env.cloud up -d

          echo "=== Waiting for services to be ready ==="
          sleep 10

          echo "=== Checking container status ==="
          docker-compose -f docker-compose.services.yml --env-file .env.cloud ps

          echo "=== Service logs (last 30 lines) ==="
          docker-compose -f docker-compose.services.yml --env-file .env.cloud logs --tail=30
          EOF

      - name: Verify connectivity to Gateway
        continue-on-error: true
        run: |
          echo "Checking if services are reachable from gateway..."
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} << 'EOF'
          echo "Testing gRPC connectivity to services..."
          docker run --rm --network quetxal-net curlimages/curl:latest \
            nc -zv 10.128.0.2 50051 || echo "gRPC port check skipped"
          EOF

      - name: Notify deployment
        if: always()
        run: |
          echo "✅ Microservices deployment completed"
          echo "Check logs: ssh -i ~/.ssh/id_rsa -J ${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} ${{ secrets.SSH_USER }}@${{ secrets.SERVICES_VM_IP }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Microservices deployment failed"
          exit 1
