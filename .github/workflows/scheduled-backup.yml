name: Scheduled Database Backup

on:
  schedule:
    # Run every day at 02:00 UTC (approx. midnight in some US timezones)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Run Database Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          : "${{ secrets.SSH_KEY }}" || { echo " ERROR: SSH_KEY is missing"; exit 1; }
          : "${{ secrets.SSH_USER }}" || { echo " ERROR: SSH_USER is missing"; exit 1; }
          : "${{ secrets.GATEWAY_VM_IP }}" || { echo " ERROR: GATEWAY_VM_IP is missing"; exit 1; }
          : "${{ secrets.DATABASE_VM_IP }}" || { echo " ERROR: DATABASE_VM_IP is missing"; exit 1; }
        shell: bash

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Add gateway host key to runner known_hosts
          ssh-keyscan -H "${{ secrets.GATEWAY_VM_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Best-effort: obtain DB host key from gateway and add it (avoids interactive prompt)
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} "ssh-keyscan -H ${{ secrets.DATABASE_VM_IP }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Backup Script on Remote VM (via Gateway)
        run: |
          echo "Triggering backup script on database VM..."
          ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} \
            "bash /home/${{ secrets.SSH_USER }}/quetxal/scripts/backup-databases.sh"

      - name: Download Backup Archive from Remote VM (via Gateway)
        run: |
          echo "Finding the latest backup file on the VM..."
          LATEST_BACKUP=$(ssh -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }} \
            "ls -1t /home/${{ secrets.SSH_USER }}/quetxal/backups/quetxal_backup_*.tar.gz | head -n 1")

          if [ -z "${LATEST_BACKUP}" ]; then
            echo " ERROR: No backup files found on the VM!"
            exit 1
          fi

          echo "Found latest backup file: ${LATEST_BACKUP}"
          echo "Downloading file to runner..."
          scp -i ~/.ssh/id_ed25519 -o ProxyJump=${{ secrets.SSH_USER }}@${{ secrets.GATEWAY_VM_IP }} \
            ${{ secrets.SSH_USER }}@${{ secrets.DATABASE_VM_IP }}:${LATEST_BACKUP} ./quetxal_backup_latest.tar.gz

      - name: Upload Backup File as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quetxal-db-backup
          path: ./quetxal_backup_latest.tar.gz
          retention-days: 14

      - name: Notify Success
        if: success()
        run: |
          echo "Database backup created and downloaded successfully."
          echo "Backups are safely archived on VM and attached to this GitHub Actions Run as an artifact."

      - name: Notify Failure
        if: failure()
        run: |
          echo " Database backup pipeline failed!"
          exit 1
