; Inventario de EJEMPLO (manual). En la práctica Terraform genera
; inventory/hosts.gen.ini con las IPs reales tras `terraform apply`.
; Copia este archivo a hosts.gen.ini y ajusta las IPs si trabajas sin Terraform.

[db]
quetxal-db ansible_host=34.0.0.10

[db:vars]
ansible_user=ubuntu
db_internal_ip=10.10.0.10

[dev_gateway]
quetxal-dev-gateway ansible_host=34.0.0.20

[dev_services]
quetxal-dev-services ansible_host=10.10.0.3 ansible_ssh_common_args='-o ProxyJump=ubuntu@34.0.0.20'

[dev:children]
dev_gateway
dev_services

[dev:vars]
ansible_user=ubuntu

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
