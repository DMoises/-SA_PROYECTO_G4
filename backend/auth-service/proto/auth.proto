syntax = "proto3";

package auth.v1;

// El codigo Go generado se colocara en internal/pb (paquete "pb").
option go_package = "github.com/grupo4/quetxaltv-auth/internal/pb;pb";

// Servicio de Identidad. Lo consume el API Gateway (unico punto de
// entrada) y otros microservicios para validar la identidad.
service AuthService {
  // Registro de una cuenta + su primer perfil (transaccion atomica).
  rpc Registrar(RegistrarRequest) returns (RegistrarResponse);
  // Inicio de sesion local (email + password) -> devuelve un JWT.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Valida un JWT y propaga la identidad (lo usan los demas servicios).
  rpc ValidarToken(ValidarTokenRequest) returns (ValidarTokenResponse);
  // Gestion de multiperfil (maximo 5 por cuenta).
  rpc CrearPerfil(CrearPerfilRequest) returns (PerfilResponse);
  rpc EditarPerfil(EditarPerfilRequest) returns (PerfilResponse);
  rpc ListarPerfiles(ListarPerfilesRequest) returns (ListarPerfilesResponse);
  rpc ActualizarPerfil(ActualizarPerfilRequest) returns (PerfilResponse);
  rpc EliminarPerfil(EliminarPerfilRequest) returns (EliminarPerfilResponse);
}

message RegistrarRequest {
  string email = 1;
  string password = 2;
  string nombre_perfil = 3; // nombre del primer perfil
}
message RegistrarResponse {
  string usuario_id = 1;
  string perfil_id = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}
message LoginResponse {
  string access_token = 1; // JWT firmado (HS256)
  string usuario_id = 2;
  int64 expira_en = 3; // timestamp unix de expiracion
}

message ValidarTokenRequest {
  string token = 1;
}
message ValidarTokenResponse {
  bool valido = 1;
  string usuario_id = 2;
  string rol = 3;
  string email = 4;
}

message CrearPerfilRequest {
  string usuario_id = 1;
  string nombre = 2;
  bool es_infantil = 3;
  string idioma = 4; // 'es' | 'en' | 'pt' | 'fr'
  string pin = 5;
}
message PerfilResponse {
  string id = 1;
  string nombre = 2;
  bool es_infantil = 3;
  string idioma = 4;
  string pin = 5;
}

message EditarPerfilRequest {
  string usuario_id = 1;
  string perfil_id = 2;
  string nombre = 3;
  bool es_infantil = 4;
  string idioma = 5;
  string pin = 6;
}

message ListarPerfilesRequest {
  string usuario_id = 1;
}
message ListarPerfilesResponse {
  repeated PerfilResponse perfiles = 1;
}

message ActualizarPerfilRequest {
  string id = 1;
  string usuario_id = 2;
  string nombre = 3;
}

message EliminarPerfilRequest {
  string id = 1;
  string usuario_id = 2;
}

message EliminarPerfilResponse {
  bool success = 1;
}
