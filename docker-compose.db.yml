services:
  auth-db:
    image: ${DOCKERHUB_USERNAME}/quetxal-auth-db:latest
    container_name: quetxal-auth-db
    restart: always
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5432:5432" # Puerto estándar PG
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  subscription-db:
    image: ${DOCKERHUB_USERNAME}/quetxal-subscription-db:latest
    container_name: quetxal-subscription-db
    restart: always
    environment:
      POSTGRES_DB: ${SUBSCRIPTION_DB_NAME}
      POSTGRES_USER: ${SUBSCRIPTION_DB_USER}
      POSTGRES_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD}
    ports:
      - "5433:5432" # Expuesto en el puerto 5433
    volumes:
      - subscription_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    image: ${DOCKERHUB_USERNAME}/quetxal-catalog-db:latest
    container_name: quetxal-catalog-db
    restart: always
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - "5434:5432" # Expuesto en el puerto 5434
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rating-db:
    image: ${DOCKERHUB_USERNAME}/quetxal-rating-db:latest
    container_name: quetxal-rating-db
    restart: always
    environment:
      POSTGRES_DB: ${RATING_DB_NAME}
      POSTGRES_USER: ${RATING_DB_USER}
      POSTGRES_PASSWORD: ${RATING_DB_PASSWORD}
    ports:
      - "5435:5432" # Expuesto en el puerto 5435
    volumes:
      - rating_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fx-db:
    image: ${DOCKERHUB_USERNAME}/quetxal-fx-db:latest
    container_name: quetxal-fx-db
    restart: always
    environment:
      POSTGRES_DB: ${FX_DB_NAME}
      POSTGRES_USER: ${FX_DB_USER}
      POSTGRES_PASSWORD: ${FX_DB_PASSWORD}
    ports:
      - "5436:5432" # Expuesto en el puerto 5436
    volumes:
      - fx_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  history-db:
    image: ${DOCKERHUB_USERNAME}/quetxal-history-db:latest
    container_name: quetxal-history-db
    restart: always
    environment:
      POSTGRES_DB: ${HISTORY_DB_NAME}
      POSTGRES_USER: ${HISTORY_DB_USER}
      POSTGRES_PASSWORD: ${HISTORY_DB_PASSWORD}
    ports:
      - "5437:5432" # Expuesto en el puerto 5437
    volumes:
      - history_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: ${DOCKERHUB_USERNAME}/quetxal-notification-db:latest
    container_name: quetxal-notification-db
    restart: always
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "5438:5432" # Expuesto en el puerto 5438
    volumes:
      - notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quetxal-redis
    restart: always
    environment:
      # Necesario para que el healthcheck pueda autenticarse dentro del contenedor.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy volatile-ttl
      --save 900 1
      --save 300 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  auth_data:
  subscription_data:
  catalog_data:
  rating_data:
  fx_data:
  history_data:
  notification_data:
  redis_data:

networks:
  default:
    driver: bridge

