version: '3.8'

services:
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/quetxal-api-gateway:latest
    container_name: quetxal-api-gateway
    restart: always
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 8080
      AUTH_SERVICE_ADDR: ${AUTH_SERVICE_ADDR:-auth-service:50051}
      HISTORY_SERVICE_ADDR: ${HISTORY_SERVICE_ADDR:-history-service:50057}
      CATALOG_SERVICE_ADDR: ${CATALOG_SERVICE_ADDR:-catalog-service:50055}
      NOTIFICATION_SERVICE_ADDR: ${NOTIFICATION_SERVICE_ADDR:-notification-service:50054}
      RATING_SERVICE_ADDR: ${RATING_SERVICE_ADDR:-rating-service:50056}
      FX_SERVICE_ADDR: ${FX_SERVICE_ADDR:-fx-service:50053}
      BILLING_SERVICE_ADDR: ${BILLING_SERVICE_ADDR:-billing-service:50052}
      WATCHPARTY_SERVICE_ADDR: ${WATCHPARTY_SERVICE_ADDR:-watchparty-service:50059}
      WATCHPARTY_WS_ADDR: ${WATCHPARTY_WS_ADDR:-watchparty-service:8085}
      CATALOG_ADMIN_HTTP_ADDR: ${CATALOG_ADMIN_HTTP_ADDR:-http://catalog-service:8086}
      COOKIE_SECURE: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Database configurations for audit logs
      AUTH_DB_HOST: ${DATABASE_VM_IP:-auth-db}
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-admin}
      SUBSCRIPTION_DB_HOST: ${DATABASE_VM_IP:-subscription-db}
      SUBSCRIPTION_DB_PORT: 5433
      SUBSCRIPTION_DB_NAME: ${SUBSCRIPTION_DB_NAME:-subscription_db}
      SUBSCRIPTION_DB_USER: ${SUBSCRIPTION_DB_USER:-subscription_user}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-admin}
      CATALOG_DB_HOST: ${DATABASE_VM_IP:-catalog-db}
      CATALOG_DB_PORT: 5434
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog_db}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-admin}
      RATING_DB_HOST: ${DATABASE_VM_IP:-rating-db}
      RATING_DB_PORT: 5435
      RATING_DB_NAME: ${RATING_DB_NAME:-rating_db}
      RATING_DB_USER: ${RATING_DB_USER:-rating_user}
      RATING_DB_PASSWORD: ${RATING_DB_PASSWORD:-admin}
      FX_DB_HOST: ${DATABASE_VM_IP:-fx-db}
      FX_DB_PORT: 5436
      FX_DB_NAME: ${FX_DB_NAME:-fx_db}
      FX_DB_USER: ${FX_DB_USER:-fx_user}
      FX_DB_PASSWORD: ${FX_DB_PASSWORD:-admin}
      HISTORY_DB_HOST: ${DATABASE_VM_IP:-history-db}
      HISTORY_DB_PORT: 5437
      HISTORY_DB_NAME: ${HISTORY_DB_NAME:-history_db}
      HISTORY_DB_USER: ${HISTORY_DB_USER:-history_user}
      HISTORY_DB_PASSWORD: ${HISTORY_DB_PASSWORD:-admin}
      NOTIFICATION_DB_HOST: ${DATABASE_VM_IP:-notification-db}
      NOTIFICATION_DB_PORT: 5438
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification_user}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-admin}
    networks:
      - quetxal-net

  frontend:
    image: ${DOCKERHUB_USERNAME}/quetxal-frontend:latest
    container_name: quetxal-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api-gateway:8080
      # GATEWAY_URL lo usan las rutas server-side (app/api/catalog/*) para
      # alcanzar el gateway DENTRO de la red docker. Sin esto cae a
      # localhost:8080 (el propio contenedor del front) -> 502.
      GATEWAY_URL: http://api-gateway:8080
    ports:
      - "80:3000"
    networks:
      - quetxal-net

networks:
  quetxal-net:
    driver: bridge
