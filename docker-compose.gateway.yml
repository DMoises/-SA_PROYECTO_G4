name: quetxal-gateway

services:
  api-gateway:
    image: ${GATEWAY_IMAGE}
    container_name: quetxal-api-gateway
    restart: always
    environment:
      GATEWAY_PORT: 8080
      AUTH_SERVICE_ADDR: ${AUTH_SERVICE_ADDR:-127.0.0.1:50051}
      COOKIE_SECURE: "true" # true en cloud (HTTPS)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "80:8080" # Mapeo estándar a puerto 80 para la web (o 8080 si el firewall hace el enrutamiento)

networks:
  default:
    driver: bridge
