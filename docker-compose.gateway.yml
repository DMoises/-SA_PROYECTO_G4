version: '3.8'

services:
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/quetxal-api-gateway:latest
    container_name: quetxal-api-gateway
    restart: always
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 8080
      AUTH_SERVICE_ADDR: ${AUTH_SERVICE_ADDR:-auth-service:50051}
      HISTORY_SERVICE_ADDR: ${HISTORY_SERVICE_ADDR:-history-service:50052}
      CATALOG_SERVICE_ADDR: ${CATALOG_SERVICE_ADDR:-catalog-service:50053}
      NOTIFICATION_SERVICE_ADDR: ${NOTIFICATION_SERVICE_ADDR:-notification-service:50054}
      RATING_SERVICE_ADDR: ${RATING_SERVICE_ADDR:-rating-service:50055}
      FX_SERVICE_ADDR: ${FX_SERVICE_ADDR:-fx-service:50056}
      BILLING_SERVICE_ADDR: ${BILLING_SERVICE_ADDR:-billing-service:50057}
      COOKIE_SECURE: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "80:8080"
    networks:
      - quetxal-net

  frontend:
    image: ${DOCKERHUB_USERNAME}/quetxal-frontend:latest
    container_name: quetxal-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api-gateway:8080
    ports:
      - "3000:3000"
    networks:
      - quetxal-net

networks:
  quetxal-net:
    driver: bridge
