name: quetxal-tv

services:


  # auth-db

  auth-db:
    build: ./database/auth
    container_name: quetxal-auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quetxal-net]


  # subscription-db

  subscription-db:
    build: ./database/subscription
    container_name: quetxal-subscription-db
    environment:
      POSTGRES_DB: ${SUBSCRIPTION_DB_NAME}
      POSTGRES_USER: ${SUBSCRIPTION_DB_USER}
      POSTGRES_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD}
    ports:
      - "${SUBSCRIPTION_DB_PORT:-5434}:5432"
    volumes:
      - subscription_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quetxal-net]


  # catalog-db

  catalog-db:
    build: ./database/catalog
    container_name: quetxal-catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - "${CATALOG_DB_PORT:-5435}:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quetxal-net]


  # rating-db

  rating-db:
    build: ./database/rating
    container_name: quetxal-rating-db
    environment:
      POSTGRES_DB: ${RATING_DB_NAME}
      POSTGRES_USER: ${RATING_DB_USER}
      POSTGRES_PASSWORD: ${RATING_DB_PASSWORD}
    ports:
      - "${RATING_DB_PORT:-5436}:5432"
    volumes:
      - rating_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quetxal-net]


  # fx-db

  fx-db:
    build: ./database/fx
    container_name: quetxal-fx-db
    environment:
      POSTGRES_DB: ${FX_DB_NAME}
      POSTGRES_USER: ${FX_DB_USER}
      POSTGRES_PASSWORD: ${FX_DB_PASSWORD}
    ports:
      - "${FX_DB_PORT:-5437}:5432"
    volumes:
      - fx_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quetxal-net]


  # history-db

  history-db:
    build: ./database/history
    container_name: quetxal-history-db
    environment:
      POSTGRES_DB: ${HISTORY_DB_NAME}
      POSTGRES_USER: ${HISTORY_DB_USER}
      POSTGRES_PASSWORD: ${HISTORY_DB_PASSWORD}
    ports:
      - "${HISTORY_DB_PORT:-5438}:5432"
    volumes:
      - history_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quetxal-net]


  # notification-db

  notification-db:
    build: ./database/notification
    container_name: quetxal-notification-db
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "${NOTIFICATION_DB_PORT:-5439}:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quetxal-net]


  # redis (cache del fx-service)

  redis:
    image: redis:7-alpine
    container_name: quetxal-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quetxal-net]


# auth-service
  auth-service:
    build: ./backend/auth-service
    container_name: quetxal-auth-service
    environment:
      GRPC_PORT: 50051
      AUTH_DB_HOST: auth-db          # nombre del servicio de la base
      AUTH_DB_PORT_INTERNAL: 5432    # puerto INTERNO de postgres (no el de host)
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
    ports:
      - "50051:50051"   # solo para probar con Postman en LOCAL; quitar en cloud
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [quetxal-net]

  # -------- API Gateway (Go + HTTP) : unico punto de entrada --------
  api-gateway:
    build: ./backend/api-gateway
    container_name: quetxal-api-gateway
    environment:
      GATEWAY_PORT: 8080
      AUTH_SERVICE_ADDR: auth-service:50051
      BILLING_SERVICE_ADDR: billing-service:50052
      COOKIE_SECURE: "false"        # true en cloud (HTTPS)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"   # este SI es publico: el frontend entra por aqui
    depends_on:
      - auth-service
      - billing-service
    networks: [quetxal-net]

  # notification-service
  notification-service:
    build: ./backend/notification-service
    container_name: quetxal-notification-service
    environment:
      GRPC_URL: 0.0.0.0:50054
      NOTIFICATION_DB_HOST: notification-db
      NOTIFICATION_DB_PORT_INTERNAL: 5432
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-Quetxal TV <no-reply@quetxal.tv>}
    ports:
      - "50054:50054"
    depends_on:
      notification-db:
        condition: service_healthy
    networks: [quetxal-net]

  # billing-service
  billing-service:
    build: ./backend/billing-service
    container_name: quetxal-billing-service
    environment:
      SUBSCRIPTION_DB_HOST: subscription-db
      SUBSCRIPTION_DB_PORT: 5432
      SUBSCRIPTION_DB_NAME: ${SUBSCRIPTION_DB_NAME}
      SUBSCRIPTION_DB_USER: ${SUBSCRIPTION_DB_USER}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD}
    ports:
      - "50052:50052"
    depends_on:
      subscription-db:
        condition: service_healthy
    networks: [quetxal-net]

volumes:
  auth_data:
  subscription_data:
  catalog_data:
  rating_data:
  fx_data:
  history_data:
  notification_data:
  redis_data:




networks:
  quetxal-net:
    driver: bridge
