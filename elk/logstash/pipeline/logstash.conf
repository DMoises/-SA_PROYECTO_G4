# Pipeline de Logstash para Quetxal TV.
# Entrada: Filebeat (cluster GKE + VMs) por el puerto 5044.
# Salida:  Elasticsearch, índice diario quetxal-logs-YYYY.MM.dd.

input {
  beats {
    port => 5044
  }
}

filter {
  # Marca el origen para distinguir cluster vs VMs en Kibana.
  if [kubernetes] {
    mutate { add_field => { "origen" => "gke" } }
  } else {
    mutate { add_field => { "origen" => "vm" } }
  }

  # Intenta parsear logs JSON de los microservicios (los que logean estructurado).
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "quetxal-logs-%{+YYYY.MM.dd}"
  }
}
