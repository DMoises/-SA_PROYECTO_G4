apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: quetxal-tv-prod
  labels:
    app: api-gateway
spec:
  replicas: 2
  # PUNTO 9: Despliegue Zero-Downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25% # Se pueden crear hasta un 25% de pods extra durante el rollout
      maxUnavailable: 25% # Se permite que un 25% de pods no estén disponibles
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: tu-registro/quetxal-api-gateway:latest
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: quetxal-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        # PUNTO 10: Monitoreo de Salud
        readinessProbe:
          httpGet:
            path: /health # Asumiendo que el gateway tiene un endpoint de health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: quetxal-tv-prod
spec:
  type: ClusterIP # Siguiendo la regla de NO exponer LoadBalancer directo
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
