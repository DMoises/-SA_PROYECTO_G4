apiVersion: v1
kind: Secret
metadata:
  name: quetxal-secrets
  namespace: quetxal-tv-prod
type: Opaque
# NOTA IMPORTANTE: Este es un archivo plantilla. 
# Por regla de seguridad (Requisito 8), NUNCA hardcodear contraseñas reales aquí.
# Durante el CI/CD, estos valores deben ser reemplazados usando sed o envsubst con los GitHub Secrets
stringData:
  # Databases
  AUTH_DB_NAME: "${AUTH_DB_NAME}"
  AUTH_DB_USER: "${AUTH_DB_USER}"
  AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD}"

  SUBSCRIPTION_DB_NAME: "${SUBSCRIPTION_DB_NAME}"
  SUBSCRIPTION_DB_USER: "${SUBSCRIPTION_DB_USER}"
  SUBSCRIPTION_DB_PASSWORD: "${SUBSCRIPTION_DB_PASSWORD}"

  CATALOG_DB_NAME: "${CATALOG_DB_NAME}"
  CATALOG_DB_USER: "${CATALOG_DB_USER}"
  CATALOG_DB_PASSWORD: "${CATALOG_DB_PASSWORD}"

  RATING_DB_NAME: "${RATING_DB_NAME}"
  RATING_DB_USER: "${RATING_DB_USER}"
  RATING_DB_PASSWORD: "${RATING_DB_PASSWORD}"

  FX_DB_NAME: "${FX_DB_NAME}"
  FX_DB_USER: "${FX_DB_USER}"
  FX_DB_PASSWORD: "${FX_DB_PASSWORD}"

  HISTORY_DB_NAME: "${HISTORY_DB_NAME}"
  HISTORY_DB_USER: "${HISTORY_DB_USER}"
  HISTORY_DB_PASSWORD: "${HISTORY_DB_PASSWORD}"

  NOTIFICATION_DB_NAME: "${NOTIFICATION_DB_NAME}"
  NOTIFICATION_DB_USER: "${NOTIFICATION_DB_USER}"
  NOTIFICATION_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD}"

  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # App Secrets
  JWT_SECRET: "${JWT_SECRET}"

  # FX API Settings
  FX_API_URL: "${FX_API_URL}"
  FX_API_TIMEOUT: "${FX_API_TIMEOUT}"
  FX_CACHE_TTL: "${FX_CACHE_TTL}"

  # SMTP Notification
  SMTP_HOST: "${SMTP_HOST}"
  SMTP_USER: "${SMTP_USER}"
  SMTP_PASS: "${SMTP_PASS}"
  SMTP_FROM: "${SMTP_FROM}"

  # GCS (Para la tarea 2 en el futuro)
  GCS_ACCESS_KEY: "${GCS_ACCESS_KEY}"
  GCS_SECRET_KEY: "${GCS_SECRET_KEY}"
  GCS_BUCKET_NAME: "${GCS_BUCKET_NAME}"
