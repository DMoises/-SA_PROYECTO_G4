apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-db
  namespace: quetxal-tv-prod
  labels:
    app: rating-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rating-db
  template:
    metadata:
      labels:
        app: rating-db
    spec:
      containers:
      - name: postgres
        image: tu-registro/quetxal-rating-db:latest
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: RATING_DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: RATING_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: RATING_DB_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "25m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rating-db
  namespace: quetxal-tv-prod
spec:
  type: ClusterIP
  selector:
    app: rating-db
  ports:
  - port: 5432
    targetPort: 5432
