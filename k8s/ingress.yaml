###############################################################################
# INGRESS — Único punto de entrada de tráfico web externo (Fase 3, tarea 9)
#
# Controlador: ingress-nginx (1 sola IP externa = LoadBalancer del controller).
# Es el único recurso que expone la malla a internet; todo lo demás es ClusterIP.
#
# RUTEO POR PATH (sin dominio): según indicación del auxiliar, el sitio se sirve
# en "/" sobre la IP pelada del LoadBalancer, así no hace falta solicitar/configurar
# un dominio. Se abre directo en:  http://<EXTERNAL-IP>/
#
# Arquitectura: el frontend (Next.js) es el único componente público. Habla con el
# API Gateway de forma INTERNA (ClusterIP http://api-gateway:8080, patrón BFF), por
# lo que el Gateway NO se expone al navegador (no se revela la topología interna).
#
# Instalación del controlador (una sola vez por cluster):
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/cloud/deploy.yaml
#   kubectl get svc -n ingress-nginx ingress-nginx-controller   # toma la EXTERNAL-IP
#
# El firewall quetxal-allow-health-checks (terraform) habilita los health checks
# del Load Balancer de GCP.
###############################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quetxal-ingress
  namespace: quetxal-tv-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # WebSocket de Watch Party: son conexiones de larga duración. Subimos los
    # timeouts para que nginx no corte el /ws a los 60s (default) y la sala
    # quede sincronizando. ingress-nginx reenvía el upgrade Upgrade/Connection
    # automáticamente al detectar el handshake.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx

  # Todo lo que no calce con una regla cae al frontend → la IP pelada abre el sitio.
  defaultBackend:
    service:
      name: frontend-service
      port:
        number: 80

  rules:
  # Sitio público servido en "/" (sin host → responde para cualquier dominio/IP).
  - http:
      paths:
      # WebSocket de Watch Party: Next.js (patrón BFF) NO puede proxiar WebSockets
      # crudos —solo HTTP—, así que /ws va DIRECTO al api-gateway, que a su vez lo
      # reenvía al watchparty-service:8085. Es la única ruta del gateway expuesta al
      # navegador, y solo porque el WS no puede pasar por el BFF. Prefix /ws gana a /
      # por especificidad, así que /ws/watchparty/<code> entra por aquí.
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
