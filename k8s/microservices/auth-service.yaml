apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: quetxal-tv-prod
  labels:
    app: auth-service
spec:
  replicas: 2 # Alta disponibilidad
  # PUNTO 9: Despliegue Zero-Downtime y Rollback
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # Se permite crear 1 pod extra durante el despliegue
      maxUnavailable: 0 # Ningun pod viejo se elimina hasta que el nuevo esté Ready
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: tu-registro/quetxal-auth-service:latest # Esto se reemplazará en CI/CD dinámicamente
        ports:
        - containerPort: 50051
          name: grpc
        envFrom:
        - configMapRef:
            name: quetxal-config # Importa variables base
        env:
        # Variables cifradas (Passwords/Secrets)
        - name: AUTH_DB_NAME
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: AUTH_DB_NAME
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: AUTH_DB_USER
        - name: AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: AUTH_DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        # PUNTO 10: Monitoreo de Salud de la Aplicación
        readinessProbe:
          tcpSocket:
            port: 50051 # Espera a que el puerto gRPC este escuchando
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 50051 # Verifica que el proceso no esté colgado
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: quetxal-tv-prod
spec:
  type: ClusterIP # Solo accesible internamente por el API Gateway y otros servicios
  selector:
    app: auth-service
  ports:
  - port: 50051
    targetPort: 50051
