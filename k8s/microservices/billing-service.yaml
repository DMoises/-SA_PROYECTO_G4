apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: quetxal-tv-prod
  labels:
    app: billing-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
      - name: billing-service
        image: tu-registro/quetxal-billing-service:latest
        ports:
        - containerPort: 50052
          name: grpc
        envFrom:
        - configMapRef:
            name: quetxal-config
        env:
        - name: GRPC_PORT
          value: "50052"
        - name: SUBSCRIPTION_DB_NAME
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: SUBSCRIPTION_DB_NAME
        - name: SUBSCRIPTION_DB_USER
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: SUBSCRIPTION_DB_USER
        - name: SUBSCRIPTION_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: SUBSCRIPTION_DB_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        readinessProbe:
          tcpSocket:
            port: 50052
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 50052
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: quetxal-tv-prod
spec:
  type: ClusterIP
  selector:
    app: billing-service
  ports:
  - port: 50052
    targetPort: 50052
