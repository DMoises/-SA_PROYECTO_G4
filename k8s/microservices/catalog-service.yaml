apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: quetxal-tv-prod
  labels:
    app: catalog-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: tu-registro/quetxal-catalog-service:latest
        ports:
        - containerPort: 50055
          name: grpc
        envFrom:
        - configMapRef:
            name: quetxal-config
        env:
        - name: GRPC_PORT
          value: "50055"
        - name: CATALOG_DB_NAME
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: CATALOG_DB_NAME
        - name: CATALOG_DB_USER
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: CATALOG_DB_USER
        - name: CATALOG_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quetxal-secrets
              key: CATALOG_DB_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        readinessProbe:
          tcpSocket:
            port: 50055
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 50055
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: quetxal-tv-prod
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
  - port: 50055
    targetPort: 50055
