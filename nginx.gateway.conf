# Edge reverse-proxy del entorno DEVELOP (VM dev_gateway, puerto 80).
#
# Replica el ruteo del Ingress de GKE para que Watch Party sincronice también en
# develop: el WebSocket /ws/* va DIRECTO al api-gateway (Next.js, patrón BFF, no
# puede proxiar WebSockets crudos), y todo lo demás va al frontend (Next.js), que
# mantiene sus rewrites server-side /api/* -> gateway.
#
# Se monta como /etc/nginx/conf.d/default.conf en el contenedor `edge`.

upstream frontend_up { server frontend:3000; }
upstream gateway_up  { server api-gateway:8080; }

server {
    listen 80;
    server_name _;

    # WebSocket de Watch Party -> gateway -> watchparty-service:8085.
    # Headers de upgrade + timeouts largos para que la sala no se corte.
    location /ws/ {
        proxy_pass http://gateway_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Sitio (Next.js). Conserva el BFF: los /api/* los reenvía el propio Next.js
    # al gateway por la red interna, así que aquí solo pasamos el tráfico HTTP.
    location / {
        proxy_pass http://frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
